[tools]
java = "temurin-21"
gradle = "latest"
android-sdk = "latest"
go = "latest"

[env]
ANDROID_HOME = "{{config_root}}/.android-sdk"
ANDROID_SDK_ROOT = "{{config_root}}/.android-sdk"

[settings]
lockfile = true

[tasks.check]
description = "L0-L2: lint, compile (warnings as errors), unit + property + simulation tests, UI screenshot goldens, Go remote tests"
run = [
  "./gradlew --console=plain -q ktlintCheck :core:test :app:verifyRoborazziDebug :app:assembleDebug",
  "mise run remote:test",
]

[tasks."check:catalog"]
description = "L3: live catalog smoke test against every distro (network)"
run = "./gradlew --console=plain -q :core:test -Plive --rerun"

[tasks."check:device"]
description = "L4: end-to-end on the real phone with this Mac as USB host (local only; takes the device lock)"
run = "bash scripts/check-device.sh"

[tasks."check:all"]
description = "L0-L4: check, then the live catalog in parallel with the device checks (drives, HID, then remote)"
run = '''
set -eu
mise run check
mise run check:catalog > build/check-catalog.log 2>&1 &
catalog=$!
device_status=0
bash scripts/check-device.sh --skip-build || device_status=$?
[ "$device_status" -eq 0 ] && { bash scripts/check-device-hid.sh || device_status=$?; }
[ "$device_status" -eq 0 ] && { bash scripts/check-device-remote.sh || device_status=$?; }
catalog_status=0
wait "$catalog" || catalog_status=$?
[ "$catalog_status" -eq 0 ] && echo "check:catalog PASS" || { cat build/check-catalog.log; echo "check:catalog FAIL"; }
[ "$device_status" -eq 0 ] && [ "$catalog_status" -eq 0 ]
'''

[tasks."check:device:hid"]
description = "L4 HID: enumerate keyboard + mouse on the Mac, send only harmless input, turn off (needs `mise run deploy`)"
run = "sh scripts/check-device-hid.sh"

[tasks."check:device:remote"]
description = "L4 remote: the real bootleg CLI over the tailnet: pending, approve, RO mount, harmless HID, revoke (needs `mise run deploy` and an enrolled node)"
run = "bash scripts/check-device-remote.sh"

[tasks.deploy]
description = "Install the debug app on the phone and pre-grant root + storage access"
run = ["./gradlew --console=plain -q :app:installDebug", "sh scripts/grant-root.sh"]

[tasks."screenshots:record"]
description = "Re-record the UI screenshot goldens in app/src/test/screenshots (look at the diff before committing)"
run = "./gradlew --console=plain -q :app:recordRoborazziDebug --tests '*ScreenshotTest*'"

[tasks.format]
description = "Auto-format Kotlin sources"
run = "./gradlew --console=plain -q ktlintFormat"

[tasks."fixtures:refresh"]
description = "Re-record catalog fixtures from the live sites (review the diff before committing)"
run = "./gradlew --console=plain -q :core:test --rerun -Precord"

[tasks."remote:aar"]
description = "Build the embedded Tailscale node (remote/) into remote/build/bootlegremote.aar with gomobile"
dir = "remote"
run = '''
set -eu
export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_HOME/ndk/30.0.16248370}"
GOBIN="$PWD/build/bin" go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
PATH="$PWD/build/bin:$PATH" gomobile bind -target android/arm64 -androidapi 30 -trimpath -ldflags "-s -w" -o build/bootlegremote.aar ./bootlegremote
'''

[tasks."remote:cli"]
description = "Build the bootleg CLI into build/bin/bootleg"
dir = "remote"
run = "mkdir -p ../build/bin && go build -o ../build/bin/bootleg ./cmd/bootleg"

[tasks."remote:test"]
description = "Vet and unit-test the Go remote module"
dir = "remote"
run = "go vet ./... && go test ./..."

[tasks."remote:keycodes"]
description = "Regenerate remote/protocol/keycodes.json from core's BrowserKeyCodes (review the diff)"
dir = "remote"
run = "go test ./protocol -run TestKeyCodesMatchCoreBrowserKeyCodes -count=1 -update"
